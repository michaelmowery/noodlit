name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
  actions: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Stamp the version at deploy time so PRs never touch version numbers (no merge conflicts).
      # 0.<deploy number> shows in About; the service-worker cache name also carries the commit,
      # so every deploy installs a fresh cache and the "New version ready" pill fires.
      # The whole line is rewritten, so a stray hand-edited number can't break it.
      - name: Stamp version
        run: |
          APP_VERSION="0.${{ github.run_number }}"
          BUILD="v${{ github.run_number }}-${GITHUB_SHA::7}"
          sed -i -E "s|^const VERSION = '[^']*';|const VERSION = 'noodlit-${BUILD}';|" www/sw.js
          sed -i -E "s|^const STAMP = '[^']*';|const STAMP = '${APP_VERSION}';|" www/src/about.js
          grep -q "^const VERSION = 'noodlit-${BUILD}';" www/sw.js
          # The offline file list: every file in www/ except the worker itself and hosting files.
          FILES=$(cd www && find . -type f ! -name sw.js ! -name CNAME ! -name .nojekyll | LC_ALL=C sort | sed "s|.*|'&'|" | paste -sd, -)
          sed -i -E "s|^const SHELL = \[.*\];|const SHELL = ['./',${FILES}];|" www/sw.js
          grep -q "^const SHELL = \['./','./about.css'" www/sw.js
          grep -q "'./src/boot.js'" www/sw.js
          grep -q "^const STAMP = '${APP_VERSION}';" www/src/about.js
          echo "Deploying Noodlit ${APP_VERSION} (cache noodlit-${BUILD})" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      # Since Nov 24 the deploy step has looked for the artifact a split second after upload and
      # found none ("No artifacts named github-pages were found"), though the upload succeeded.
      # Wait until the run's artifact list shows it, then deploy.
      - name: Wait for the artifact to be listed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 24); do
            n=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?name=github-pages" --jq '.total_count' || echo 0)
            if [ "$n" -ge 1 ]; then echo "Artifact listed after $((i*5 - 5))s"; sleep 5; exit 0; fi
            sleep 5
          done
          echo "Artifact still not listed after 2 minutes; trying the deploy anyway"
      - id: deployment
        uses: actions/deploy-pages@v4
