<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-visual">
  <title>Noodlit</title>
  <meta name="description" content="A fading scratchpad for getting ideas out of your head.">
  <meta name="theme-color" content="#1b242b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Noodlit">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <canvas id="stage" aria-label="Fogged glass drawing surface"></canvas>

  <div id="ui">
    <div class="wordmark" aria-hidden="true"><img class="wordmark-logo" src="icons/icon.svg" alt="" width="26" height="26"><span>noodlit</span></div>
    <div id="mode" class="mode" role="group" aria-label="Mode">
      <button type="button" data-mode="fade" aria-pressed="true">Fade</button>
      <button type="button" data-mode="release" aria-pressed="false">Release</button>
    </div>
    <div id="toast" role="status" aria-live="polite"></div>
    <nav class="toolbar" aria-label="Controls">
      <button id="btn-env" class="icon-only" type="button" aria-label="Change surface">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4l8.5 4.5L12 13 3.5 8.5 12 4zM3.5 12.5L12 17l8.5-4.5M3.5 16.5L12 21l8.5-4.5"/></svg>
      </button>
      <button id="btn-prompt" class="icon-only" type="button" aria-label="Give me a prompt">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 18h5M10.5 21h3M12 3a6 6 0 0 0-3.6 10.8c.7.5 1.1 1.3 1.1 2.1V16h5v-.1c0-.8.4-1.6 1.1-2.1A6 6 0 0 0 12 3z"/></svg>
      </button>
      <button id="btn-type" class="icon-only" type="button" aria-label="Type: write with the keyboard">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6.5h16a1.5 1.5 0 0 1 1.5 1.5v8a1.5 1.5 0 0 1-1.5 1.5H4A1.5 1.5 0 0 1 2.5 16V8A1.5 1.5 0 0 1 4 6.5zM6 10h.01M9.33 10h.01M12.67 10h.01M16 10h2M6 13.5h.01M8.5 14h7M18 13.5h.01"/></svg>
      </button>
      <button id="btn-speed" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9c3-3 6 3 9 0s6 3 9 0M3 15c3-3 6 3 9 0s6 3 9 0"/></svg>
        <span class="label">Flow</span>
      </button>
      <button id="btn-hold" type="button" aria-pressed="false" aria-label="Hold: pause the fade">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6v12M15 6v12"/></svg>
        <span class="label">Hold</span>
      </button>
      <button id="btn-clear" type="button" aria-label="Clear the glass">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path id="clear-icon" d="M7 18h10a4 4 0 0 0 .6-7.96A6 6 0 0 0 6.2 10 4 4 0 0 0 7 18z"/></svg>
        <span class="label">Steam up</span>
      </button>
    </nav>
    <div id="type-spot" aria-hidden="true"></div>
    <form id="compose" hidden autocomplete="off">
      <textarea id="compose-input" rows="1" maxlength="160" enterkeyhint="enter" autocapitalize="sentences" spellcheck="false" placeholder="Type a thought…" aria-label="Type on the surface"></textarea>
      <button id="compose-done" type="submit">Done</button>
    </form>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
